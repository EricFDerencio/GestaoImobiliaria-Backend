# Porta do backend (o frontend roda na 8080)
server.port=8081

# Banco H2 em memória (os dados somem ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:mem:imoveisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria a tabela a partir da entidade
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
